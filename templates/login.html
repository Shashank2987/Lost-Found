{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center" style="min-height:80vh; align-items:center;">

    <div class="col-md-5">

        <div class="glass p-5 rounded-4">

            <h2 class="text-center mb-4">
                Welcome Back
            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label text-white">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label text-white">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-main w-100">

                    Login

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
