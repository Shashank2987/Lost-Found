{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="glass p-5 rounded-4">

                <h1 class="fw-bold mb-4">
                    ✏️ Edit Item
                </h1>

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">
                            Item Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ item.title }}"
                            required
                        >

                    </div>

                    <div class="row mb-4">

                        <div class="col-md-6">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-control"
                            >

                                <option value="{{ item.category }}">
                                    {{ item.category }}
                                </option>

                                <option value="Wallet">Wallet</option>
                                <option value="ID Card">ID Card</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Books">Books</option>
                                <option value="Bags">Bags</option>
                                <option value="Keys">Keys</option>
                                <option value="Other">Other</option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Campus
                            </label>

                            <select
                                name="campus"
                                class="form-control"
                            >

                                <option value="{{ item.campus }}">
                                    {{ item.campus }}
                                </option>

                                <option value="JIIT Sec-128">
                                    JIIT Sec-128
                                </option>

                                <option value="JIIT Sec-62">
                                    JIIT Sec-62
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            value="{{ item.location }}"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            rows="5"
                            class="form-control"
                            required
                        >{{ item.description }}</textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-main"
                        >
                            Save Changes
                        </button>

                        <a
                            href="/dashboard"
                            class="btn btn-glass"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
