<!DOCTYPE html>
<html>
<head>
    <title>Register - CampusFind</title>
</head>
<body>

    <h1>Register</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>
</html>
