{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="glass p-5 rounded-4">

        <!-- Title -->
        <div class="d-flex justify-content-between align-items-start">

            <h1 class="fw-bold">
                {{ item.title }}
            </h1>

            <span class="badge bg-success px-3 py-2">
                FOUND
            </span>

        </div>

        <hr style="border-color:rgba(255,255,255,0.1);">

        <!-- Info -->
        <p class="text-secondary mt-3">
            {{ item.description }}
        </p>

        <div class="mt-4">

            <p>📍 <b>Location:</b> {{ item.location }}</p>

            <p>📅 <b>Found on:</b> {{ item.created_at.strftime('%d %b %Y') }}</p>

        </div>

        <!-- Claim Section -->
        <div class="mt-5 glass p-4 rounded-4">

            <h4>Claim this item</h4>

            <p class="text-secondary">
                If this belongs to you, click below to send a claim request.
            </p>

            <a href="/claim/{{ item.id }}" class="btn btn-main">
                I Own This Item
            </a>

        </div>

    </div>

</div>

{% endblock %}
