<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFind</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        :root{
            --primary:#6366f1;
            --primary-hover:#4f46e5;
            --success:#22c55e;
            --danger:#ef4444;
            --bg:#0f172a;
            --card:rgba(255,255,255,0.06);
            --text:#f8fafc;
            --muted:#94a3b8;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            transition: all .2s ease;
        }

        body{
            min-height:100vh;
            background:
                radial-gradient(circle at top left,
                rgba(99,102,241,.25),
                transparent 35%),

                radial-gradient(circle at bottom right,
                rgba(34,197,94,.15),
                transparent 35%),

                #0f172a;

            color:var(--text);
        }

        html{
            scroll-behavior:smooth;
        }

        /* NAVBAR */
        .navbar{
            position:sticky;
            top:0;
            z-index:1000;

            backdrop-filter:blur(20px);
            background:rgba(15,23,42,.6) !important;

            border-bottom:1px solid rgba(255,255,255,.08);
            padding:15px 0;
        }

        .navbar-brand{
            font-weight:800;
            color:white !important;
        }

        /* GLASS CARD */
        .glass{
            background:var(--card);
            border:1px solid rgba(255,255,255,.08);
            backdrop-filter:blur(20px);

            box-shadow:
                0 8px 32px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.05);

            border-radius:16px;
        }

        /* BUTTONS */
        .btn-main{
            background:linear-gradient(135deg, var(--primary), #8b5cf6);
            border:none;
            color:white;
            padding:10px 18px;
            border-radius:12px;
            font-weight:600;
        }

        .btn-main:hover{
            transform:translateY(-2px);
            background:linear-gradient(135deg, var(--primary-hover), #7c3aed);
            color:white;
        }

        .btn-glass{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15);
            color:white;
            padding:10px 18px;
            border-radius:12px;
        }

        .btn-glass:hover{
            background:rgba(255,255,255,.15);
            color:white;
        }

        .btn-danger{
            border-radius:12px;
        }

        /* FORMS */
        .form-control{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15);
            color:white;
            border-radius:12px;
        }

        .form-control:focus{
            background:rgba(255,255,255,.12);
            color:white;
            border-color:var(--primary);
            box-shadow:none;
        }

        .form-control::placeholder{
            color:var(--muted);
        }

        /* FEATURE CARDS */
        .feature-card{
            transition:.3s;
            cursor:pointer;
        }

        .feature-card:hover{
            transform:translateY(-8px) scale(1.02);
        }

        /* TEXT */
        .text-secondary{
            color:var(--muted) !important;
        }
        select.form-control{
    background: rgba(255,255,255,0.08) !important;
    color: #f8fafc !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    select.form-control{
    background: rgba(255,255,255,.08) !important;
    color: white !important;
    border: 1px solid rgba(255,255,255,.15) !important;
}

select.form-control option{
    background: #1e293b;
    color: white;
}

textarea.form-control{
    resize: none;
}
}

/* Dropdown options (fix invisible text) */
select option{
    background: #1e293b;
    color: #f8fafc;
}
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">

    <div class="container">

        <!-- BRAND -->
        <a class="navbar-brand d-flex flex-column" href="/">

            <span>📦 CampusFind</span>

            <small style="font-size:.7rem; color:#94a3b8;">
                Recover. Reconnect.
            </small>

        </a>

        <!-- NAV LINKS -->
        <div class="d-flex gap-2 align-items-center">

            {% if current_user.is_authenticated %}

                <a href="/dashboard" class="btn btn-glass">
                    Dashboard
                </a>

                <a href="/items" class="btn btn-glass">
                    Found Items
                </a>

                <a href="/add-found" class="btn btn-main">
                    + Report Item
                </a>

                <a href="/logout" class="btn btn-danger">
                    Logout
                </a>

            {% else %}

                <a href="/login" class="btn btn-glass">
                    Login
                </a>

                <a href="/register" class="btn btn-main">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<!-- PAGE CONTENT -->
<div class="container py-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
