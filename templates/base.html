<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFind</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0b1020;
            color:white;
            overflow-x:hidden;
            min-height:100vh;
            font-family:Inter,Segoe UI,sans-serif;
        }

        .gradient-bg{
            position:fixed;
            inset:0;
            z-index:-1;

            background:
            radial-gradient(circle at 20% 20%, rgba(99,102,241,.4), transparent 30%),
            radial-gradient(circle at 80% 30%, rgba(168,85,247,.3), transparent 30%),
            radial-gradient(circle at 50% 80%, rgba(59,130,246,.25), transparent 40%),
            #0b1020;
        }

        .navbar{
            background:transparent !important;
            padding:20px 0;
        }

        .navbar-brand{
            font-weight:700;
            font-size:1.4rem;
            color:white !important;
        }

        .glass{
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.1);
            backdrop-filter:blur(12px);
        }

        .btn-main{
            background:linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            border:none;
            color:white;
            padding:12px 24px;
            border-radius:12px;
            font-weight:600;
            transition:.3s;
        }

        .btn-main:hover{
            transform:translateY(-2px);
            color:white;
        }

        .btn-glass{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15);
            color:white;
            backdrop-filter:blur(10px);
            border-radius:12px;
            padding:12px 24px;
            transition:.3s;
        }

        .btn-glass:hover{
            background:rgba(255,255,255,.15);
            color:white;
        }

        .hero{
            min-height:90vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
        }

        .hero h1{
            font-size:5rem;
            font-weight:800;
            line-height:1.05;
        }

        .hero p{
            color:#cbd5e1;
            max-width:700px;
            margin:auto;
            font-size:1.2rem;
        }

        .feature-card{
            padding:30px;
            border-radius:20px;
            height:100%;
            transition:.3s;
        }

        .feature-card:hover{
            transform:translateY(-8px);
        }

        .form-control{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15);
            color:white;
        }

        .form-control:focus{
            background:rgba(255,255,255,.12);
            color:white;
            border-color:#6366f1;
            box-shadow:none;
        }

        .form-control::placeholder{
            color:#94a3b8;
        }

        .text-secondary{
            color:#94a3b8 !important;
        }

    </style>

</head>

<body>

<div class="gradient-bg"></div>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/">
            🎓 CampusFind
        </a>

        <div class="d-flex gap-2">

            <a href="/login" class="btn btn-glass">
                Login
            </a>

            <a href="/register" class="btn btn-main">
                Register
            </a>

        </div>

    </div>

</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
